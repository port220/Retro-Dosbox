name: Build core artifacts

# Port220: builds ONLY the native core and uploads what Gradle needs to
# package, so an APK can then be built on a machine with no Linux toolchain.
#
# Why this exists: build-core.sh requires a Linux NDK, autotools and
# pkg-config. It cannot run on Windows in any shell. Rather than stand up WSL
# just to produce four files that change only when upstream C++ changes, this
# builds them on a runner that already has the toolchain.
#
# The division of labour this enables:
#   - core (this workflow, rarely) -> libretrodos.so, libSDL3.so,
#     libc++_shared.so, SDL3.jar
#   - APK (locally, constantly)    -> Android Studio on Windows
#
# Modelled on the "Build the core" step of signed-aab.yml, minus the signing:
# a debug APK does not need the upload key, and requiring secrets here would
# stop this being runnable from a fresh fork.

on:
  workflow_dispatch:
  push:
    branches: [main, port220]

jobs:
  core:
    name: Core for arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The core is a submodule. Without this the checkout leaves core/
          # empty and build-core.sh stops with its own error about it --
          # which is the same trap that made my first hand-made zip useless.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            cmake ninja-build git unzip

      - name: Build the core
        run: |
          # Same NDK the app pins in app/build.gradle.kts. Installing the
          # pinned one rather than whatever the image ships with is the point.
          ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ ! -d "$ANDROID_NDK" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              --install "ndk;28.2.13676358"
          fi
          export ANDROID_NDK
          cd android && ./build-core.sh

      - name: Show what was produced
        run: |
          # Printed rather than assumed: a missing SDL3.jar fails the Gradle
          # build at CONFIGURATION time with an error that says nothing about
          # the core, so it is worth seeing here.
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          ls -lh android/app/libs/

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: port220-core-arm64-v8a
          path: |
            android/app/src/main/jniLibs/arm64-v8a/*.so
            android/app/libs/SDL3.jar
          if-no-files-found: error
